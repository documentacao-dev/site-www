- question: >-
    Como você monta uma URL com parâmetros de consulta usando `Uri.https`?
  options:
    - text: >-
        Passe-os como um terceiro argumento, um map:
        `Uri.https('api.com', '/search', {'q': 'dart'})`
      correct: true
      explanation: >-
        O terceiro parâmetro aceita um `Map<String, dynamic>`
        com os parâmetros de consulta. O Dart faz a codificação da URL automaticamente.
    - text: >-
        Acrescente-os à string do caminho: `Uri.https('api.com', '/search?q=dart')`
      correct: false
      explanation: >-
        Parâmetros de consulta na string do caminho funcionam, mas
        não são a abordagem mais limpa.
    - text: >-
        Use concatenação de strings: `Uri.https('api.com', '/search') + '?q=dart'`
      correct: false
      explanation: >-
        Não é possível concatenar strings a objetos `Uri` com `+`.
        `Uri` oferece outro mecanismo para adicionar parâmetros de consulta.
    - text: >-
        Chame `.addQueryParam('q', 'dart')` no objeto `Uri`.
      correct: false
      explanation: >-
        Objetos `Uri` são imutáveis e não têm um método `addQueryParam`.
        Os parâmetros de consulta devem ser especificados de outra forma.
- question: >-
    Depois de chamar `http.get(url)`,
    como você deve verificar se a requisição foi bem-sucedida?
  options:
    - text: >-
        Verificar se `response.statusCode == 200` (ou outro código de sucesso).
      correct: true
      explanation: >-
        Os códigos de status HTTP indicam sucesso (200-299)
        ou diversas falhas (400 e 500).
        Sempre verifique antes de processar o corpo da resposta.
    - text: >-
        Verificar se `response.body` não está vazio.
      correct: false
      explanation: >-
        Um corpo vazio pode ser válido (como um 204 No Content).
        O conteúdo do corpo, por si só, não diz se a requisição deu certo.
    - text: >-
        Envolver a chamada em try/catch, já que requisições bem-sucedidas não lançam exceções.
      correct: false
      explanation: >-
        Erros HTTP (como 404 e 500) não lançam exceções por padrão.
        A requisição termina normalmente mesmo quando o servidor retorna um erro.
    - text: >-
        Verificar se `response.isSuccess` retorna true.
      correct: false
      explanation: >-
        Não existe uma propriedade `isSuccess` em `Response`.
        Você precisa consultar outra propriedade do objeto de resposta.
- question: >-
    Quando a API da Wikipedia retorna um código de status diferente de 200,
    as funções de API da lição lançam um `HttpException`
    em vez de retornar uma mensagem de erro em forma de string.
    Por que essa é uma prática melhor para um pacote de API?
  options:
    - text: >-
        Ela separa o tratamento de falhas dos dados válidos,
        permitindo que as funções retornem modelos tipados (como `Summary`)
        enquanto quem chama trata os erros com `try`/`catch`.
      correct: true
      explanation: >-
        Retornar uma string de erro não se encaixa em um tipo de retorno como
        `Future<Summary>` e corre o risco de tratar o texto do erro como dados do artigo.
        Lançar um `HttpException` sinaliza a falha explicitamente, para que o código
        que chama possa capturá-la e tratá-la.
    - text: >-
        Porque `http.get` trava o runtime do Dart se você não lançar uma exceção
        para códigos de status diferentes de 200.
      correct: false
      explanation: >-
        `http.get` termina normalmente com um objeto `Response`, mesmo para os
        códigos de status 404 ou 500. Lançar `HttpException` é uma escolha de design
        deliberada, não uma exigência do runtime.
    - text: >-
        Porque lançar `HttpException` tenta novamente a requisição de rede
        que falhou até três vezes automaticamente.
      correct: false
      explanation: >-
        Lançar uma exceção interrompe a execução da função e propaga a falha
        para quem chamou; ela não repete a requisição.
    - text: >-
        Porque funções marcadas com `async` não podem retornar strings de erro
        quando uma requisição de rede falha.
      correct: false
      explanation: >-
        Uma função `async` pode retornar qualquer tipo declarado (como `Future<String>`,
        como no Capítulo 3). Lançar uma exceção é preferível por segurança de tipos
        e tratamento estruturado de erros, não por regras de sintaxe.
